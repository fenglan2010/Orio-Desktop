name: Desktop Windows pack smoke

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "backend/**"
      - "docs/**"
      - ".github/workflows/desktop-windows-pack-smoke.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "backend/**"
      - "docs/**"
      - ".github/workflows/desktop-windows-pack-smoke.yml"

jobs:
  pack-and-serve-frontend:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Bundle embedded Python (packaged runtime)
        shell: pwsh
        working-directory: desktop
        run: npm run bundle:python:win

      - name: Pack desktop (unsigned dir + NSIS)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          OIRO_DISTRIBUTION: packaged
        run: |
          Set-Location desktop
          npm ci
          npm run pack:dir
          npm run pack:win:nsis

      - name: Assert unpacked layout
        shell: pwsh
        run: |
          $paths = @(
            "desktop\dist\win-unpacked\resources\backend\app\main.py",
            "desktop\dist\win-unpacked\resources\renderer\index.html",
            "desktop\dist\win-unpacked\resources\python\python.exe"
          )
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) { throw "Missing $p" }
            Write-Host "OK: $p"
          }

      - name: HTTP smoke — bundled python, stripped PATH, HTML at root
        shell: pwsh
        run: |
          $bundledPy = (Resolve-Path "desktop\dist\win-unpacked\resources\python\python.exe").Path
          $backend = (Resolve-Path "desktop\dist\win-unpacked\resources\backend").Path
          $staticRoot = (Resolve-Path "desktop\dist\win-unpacked\resources\renderer").Path
          $dataDir = Join-Path $env:RUNNER_TEMP "oiro-pack-smoke-data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          $savedPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32"
          Write-Host "PATH stripped to: $env:PATH"

          $env:OIRO_STATIC_ROOT = $staticRoot
          $env:OIRO_DISTRIBUTION = "packaged"
          $env:OIRO_DATA_DIR = $dataDir
          $env:DATABASE_URL = "sqlite:///$dataDir/oiro.db"
          $env:OIRO_INSTALL_KEY_ACCEPT = "OIRO-TEST-0000-0000"
          $env:PYTHONPATH = $backend

          $proc = Start-Process -FilePath $bundledPy `
            -ArgumentList @("-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8765") `
            -WorkingDirectory $backend `
            -PassThru -NoNewWindow

          try {
            $html = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 5
                if ($resp.StatusCode -eq 200 -and $resp.Content -match "<html") {
                  $html = $resp.Content
                  break
                }
              } catch {
                # retry until uvicorn is up
              }
            }
            if (-not $html) {
              throw "Root URL did not return HTML (connection error, 404, or timeout)"
            }
            Write-Host "OK: served HTML from bundled python with stripped PATH"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            $env:PATH = $savedPath
          }

      - name: Zip win-unpacked for artifact upload
        shell: pwsh
        run: |
          $src = Resolve-Path "desktop\dist\win-unpacked"
          $zip = Join-Path $env:RUNNER_TEMP "oiro-win-unpacked.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $zip
          Write-Host "Zipped $src -> $zip"

      - name: Upload unpacked desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: oiro-win-unpacked
          path: ${{ runner.temp }}/oiro-win-unpacked.zip
          retention-days: 14

      - name: Upload NSIS installer (if produced)
        uses: actions/upload-artifact@v4
        if: hashFiles('desktop/dist/OIRO-Setup-*.exe') != ''
        with:
          name: oiro-setup-exe
          path: desktop/dist/OIRO-Setup-*.exe
          retention-days: 14