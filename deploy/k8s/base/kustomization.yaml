apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oiro
resources:
  - namespace.yaml
  - configmap.yaml
  - api.yaml
  - frontend.yaml
  - worker.yaml
  - beat.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Image names are overridable. Overlays point these at 腾讯云 TCR or 阿里云 ACR.
# The Secret is applied separately from secret.yaml.example — it is not
# included here so real values are never required in git.
images:
  - name: oiro-api
    newName: oiro-api
    newTag: latest
  - name: oiro-frontend
    newName: oiro-frontend
    newTag: latest
