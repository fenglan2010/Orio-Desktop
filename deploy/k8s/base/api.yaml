apiVersion: apps/v1
kind: Deployment
metadata:
  name: oiro-api
  labels:
    app.kubernetes.io/name: oiro
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oiro
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oiro
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oiro
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: oiro
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: oiro-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: oiro-config
            - secretRef:
                name: oiro-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /opt/oiro/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oiro-api
  labels:
    app.kubernetes.io/name: oiro
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oiro
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oiro
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
