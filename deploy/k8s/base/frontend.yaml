apiVersion: apps/v1
kind: Deployment
metadata:
  name: oiro-frontend
  labels:
    app.kubernetes.io/name: oiro
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: oiro
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oiro
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oiro
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: oiro
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: oiro-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OIRO_API_UPSTREAM
              value: oiro-api:8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: oiro-frontend
  labels:
    app.kubernetes.io/name: oiro
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: oiro
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oiro
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
