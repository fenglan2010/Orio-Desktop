# 阿里云 ACK overlay. Replace the ACR namespace, region, and tag; do not
# commit a live registry path that embeds secrets. Prefer RDS PostgreSQL
# and managed Redis in the same VPC. TLS terminates at SLB / ALB.
#
#   kubectl apply -k deploy/k8s/overlays/ack
#   kubectl -n oiro apply -f deploy/k8s/base/secret.yaml   # after filling placeholders
#
# Ingress class and hostname still need to be set for your cluster
# (examples only: nginx, alb). This overlay does not invent them.
# ACR hostnames vary by region; the host below is a placeholder pattern.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: oiro-api
    newName: registry.cn-hangzhou.aliyuncs.com/YOUR_NAMESPACE/oiro-api
    newTag: REPLACE_TAG
  - name: oiro-frontend
    newName: registry.cn-hangzhou.aliyuncs.com/YOUR_NAMESPACE/oiro-frontend
    newTag: REPLACE_TAG
